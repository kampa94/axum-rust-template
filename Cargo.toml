[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["json", "multipart"] }
tokio = { version = "1.35.1", features = ["full"] }
serde = { version = "1.0.193", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1.0.105"
thiserror = "2.0.21"
utoipa = "6.0.0"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15.7"
config = "0.15.27"
serde_json = "1.0.154"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "postgres", "migrate"] }
